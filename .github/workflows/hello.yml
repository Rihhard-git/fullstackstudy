name: Hello World!

on:
  push:
    branches:
      - master

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo "Hello World!"
  date:
    runs-on: ubuntu-latest
    steps:
      - name: Date
        run: |
          echo date
  ls -l:
    runs-on: ubuntu-latest
    steps:
      - name: Ls- l
        run: |
          echo ls -l
